<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세명 회사소개서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one dark stage, the open book centred and sized to the viewport, a slim control bar beneath. */
:root {
  --stage: #161d33;
  --stage-2: #1c2541;
  --ink: #e9edf6;
  --muted: #9aa6c2;
  --accent: #f0a23a;
  --line: rgba(233, 237, 246, .14);
  --paper: #ffffff;
  --ui: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --ratio: 0.7071;
  --bar: 64px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 40%, var(--stage-2) 0%, var(--stage) 70%);
  background-color: var(--stage);
  color: var(--ink);
  font-family: var(--ui);
  overflow: hidden;
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: 1fr auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 0;
  box-sizing: border-box;
}
.stage { min-height: 0; display: grid; place-items: center; }
.book-wrap {
  width: min(100%, calc((100dvh - var(--bar) - 48px) * 2 * var(--ratio)));
  filter: drop-shadow(0 18px 36px rgba(0, 0, 0, .45));
}
@media (max-width: 720px) {
  .book-wrap { width: min(100%, calc((100dvh - var(--bar) - 48px) * var(--ratio))); }
}
.page { background: var(--paper); overflow: hidden; }
.page img { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }

.stf__parent { position: relative; display: block; box-sizing: border-box; transform: translateZ(0); touch-action: pan-y; }
.sft__wrapper { position: relative; width: 100%; box-sizing: border-box; }
.stf__parent canvas { position: absolute; width: 100%; height: 100%; left: 0; top: 0; }
.stf__block { position: absolute; width: 100%; height: 100%; box-sizing: border-box; perspective: 2000px; }
.stf__item { display: none; position: absolute; transform-style: preserve-3d; }
.stf__outerShadow, .stf__innerShadow, .stf__hardShadow, .stf__hardInnerShadow { position: absolute; left: 0; top: 0; }

.bar {
  height: var(--bar);
  display: flex; align-items: center; justify-content: center;
  gap: 10px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .04);
  color: var(--ink);
  height: 40px; min-width: 40px;
  padding: 0 12px;
  border-radius: 20px;
  font: 500 13px/1 var(--ui);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: rgba(255, 255, 255, .1); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .35; cursor: default; }
.btn svg { width: 16px; height: 16px; fill: currentColor; }
.count {
  min-width: 84px; text-align: center;
  font: 500 13px/1 var(--ui); color: var(--muted);
  font-variant-numeric: tabular-nums; letter-spacing: .02em;
}
.count b { color: var(--ink); font-weight: 700; }
.sep { width: 1px; height: 22px; background: var(--line); }
.progress { position: fixed; left: 0; right: 0; bottom: 0; height: 3px; pointer-events: none; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
@media (max-width: 520px) { .bar { gap: 6px; } .hide-sm { display: none; } }
@media (prefers-reduced-motion: reduce) { .btn, .progress i { transition: none; } }
</style>

</head><body>
<div class="app">
  <main class="stage">
    <div class="book-wrap">
      <div id="book" aria-label="세명 그룹 회사소개서"></div>
    </div>
  </main>
  <nav class="bar" aria-label="플립북 조작">
    <button class="btn" id="first" type="button" title="처음으로" aria-label="처음으로">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>
    </button>
    <button class="btn" id="prev" type="button" title="이전 장 (←)" aria-label="이전 장">
      <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
    </button>
    <span class="count" id="count" aria-live="polite"><b>1</b> / 23</span>
    <button class="btn" id="next" type="button" title="다음 장 (→)" aria-label="다음 장">
      <svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg>
    </button>
    <span class="sep hide-sm"></span>
    <button class="btn hide-sm" id="fs" type="button" title="전체 화면 (F)" aria-label="전체 화면">
      <svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg>
    </button>
  </nav>
</div>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function () {
  var PAGES = 23;                 // printed pages
  var book = document.getElementById('book');

  // Slots: cover alone, spreads 02-03 … 20-21, 22 + blank, back cover alone.
  var slots = [];
  for (var i = 1; i <= PAGES; i++) {
    if (i === PAGES) slots.push(0);   // blank right page so the back cover closes on its own
    slots.push(i);
  }
  var html = '';
  slots.forEach(function (n, k) {
    var hard = (k === 0 || k === slots.length - 1) ? ' data-density="hard"' : '';
    if (!n) { html += '<div class="page"></div>'; return; }
    var s = String(n).padStart(2, '0');
    html += '<div class="page"' + hard + '><img src="pages/p-' + s + '.jpg" alt="회사소개서 ' + n + '쪽" ' +
            (n <= 4 ? 'loading="eager"' : 'loading="lazy"') + ' draggable="false"></div>';
  });
  book.innerHTML = html;

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pf = new St.PageFlip(book, {
    width: 550, height: 778, size: 'stretch',
    minWidth: 240, maxWidth: 1100, minHeight: 340, maxHeight: 1556,
    showCover: true, usePortrait: true, mobileScrollSupport: false,
    maxShadowOpacity: 0.45, flippingTime: reduce ? 300 : 900, drawShadow: true
  });
  pf.loadFromHTML(book.querySelectorAll('.page'));

  var count = document.getElementById('count');
  var barEl = document.getElementById('bar');
  var total = pf.getPageCount();
  function pg(idx) { return slots[idx] || null; }

  function label() {
    var idx = pf.getCurrentPageIndex();
    var portrait = pf.getOrientation && pf.getOrientation() === 'portrait';
    var txt;
    if (portrait || idx === 0 || idx === total - 1) {
      txt = '<b>' + (pg(idx) || pg(idx - 1)) + '</b> / ' + PAGES;
    } else {
      var left = idx % 2 === 1 ? idx : idx - 1;
      var a = pg(left), b = pg(left + 1);
      txt = '<b>' + (b ? a + '–' + b : a) + '</b> / ' + PAGES;
    }
    count.innerHTML = txt;
    barEl.style.width = ((idx + 1) / total * 100) + '%';
    document.getElementById('prev').disabled = idx === 0;
    document.getElementById('first').disabled = idx === 0;
    document.getElementById('next').disabled = idx >= total - 1;
  }

  pf.on('flip', label);
  pf.on('changeOrientation', label);
  pf.on('init', label);

  document.getElementById('prev').onclick = function () { pf.flipPrev(); };
  document.getElementById('next').onclick = function () { pf.flipNext(); };
  document.getElementById('first').onclick = function () { pf.flip(0); };

  var fsBtn = document.getElementById('fs');
  fsBtn.onclick = function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function () {});
    } catch (e) {}
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') pf.flipNext();
    else if (e.key === 'ArrowLeft') pf.flipPrev();
    else if (e.key === 'f' || e.key === 'F') fsBtn.click();
  });

  // Tablet: tap the right/left half of the book, or swipe, to turn pages.
  var wrap = document.querySelector('.book-wrap');
  var t0 = null;
  wrap.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { t0 = null; return; }
    var t = e.touches[0];
    t0 = { x: t.clientX, y: t.clientY, time: Date.now() };
  }, { passive: true, capture: true });
  wrap.addEventListener('touchend', function (e) {
    if (!t0 || !e.changedTouches.length) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - t0.x, dy = t.clientY - t0.y, dt = Date.now() - t0.time;
    var start = t0; t0 = null;
    setTimeout(function () {
      var st = pf.getState ? pf.getState() : 'read';
      if (st !== 'read') return;
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 400) {
        var r = wrap.getBoundingClientRect();
        if (start.x > r.left + r.width / 2) pf.flipNext(); else pf.flipPrev();
      } else if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) pf.flipNext(); else pf.flipPrev();
      }
    }, 60);
  }, { passive: true, capture: true });

  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
  label();
})();
</script>
</body></html>
